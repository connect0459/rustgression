name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

run-name: Release to PyPI ${{ github.event_name == 'push' && github.ref_name || 'dry run' }}

jobs:
  # Step 1: Version consistency check
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # release: types: [published] used to guarantee this via
      # target_commitish == 'main'; push: tags has no equivalent, so check
      # it explicitly to keep a release tag from ever being cut off a branch.
      - name: Verify tag points to a commit on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not reachable from origin/main."
            exit 1
          fi

      # Skipped on workflow_dispatch: GITHUB_REF is a branch there, not a tag,
      # so there is no release version to check against.
      - name: Check version consistency
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Extract version from release tag (v0.0.1 -> 0.0.1)
          VERSION=${GITHUB_REF#refs/tags/v}
          ./scripts/version-check.sh "$VERSION"

  # Step 2: Build wheels for all platforms
  build:
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        # automatically reads rust-toolchain.toml to set up the toolchain

      # Set up dependencies for Linux (Ubuntu)
      - name: Setup Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          if command -v cmake &> /dev/null; then
            echo "cmake is already installed"
            cmake --version
          else
            sudo apt-get update
            sudo apt-get install -y cmake
          fi

      # Set up dependencies for macOS
      - name: Setup macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          if command -v cmake &> /dev/null; then
            echo "cmake is already installed"
            cmake --version
          else
            brew install cmake
          fi

      # Set up dependencies for Windows
      - name: Setup Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Output "cmake is already installed"
            cmake --version
          } else {
            choco install cmake -y
          }

      # Build wheels
      - name: Build wheels
        shell: bash
        run: |
          # Sync dependencies from pyproject.toml (including main and dev dependencies)
          uv sync --frozen

          # Clean up pre-generated wheels
          # ref: <https://github.com/connect0459/rustgression/pull/44>
          rm -rf target/wheels/ || echo "No wheels directory to clean"

          # Explicitly build wheels (ensure PyPI compatibility)
          uv run maturin build --release --compatibility pypi

          # Verify built wheel locations
          echo "Built wheels:"
          ls -la target/wheels/ || echo "No wheels directory found"

      # Upload built wheels as artifacts
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl
          retention-days: 1

  # Step 3: Create the GitHub Release from the matching CHANGELOG.md section.
  # Runs in parallel with build; publish (Step 4) waits on this too, so a
  # missing/malformed CHANGELOG section blocks the PyPI release as well.
  create-release:
    needs: version-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog section for this version
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$RELEASE_VERSION" '
            /^## \[/ {
              if (capture) exit
              if (index($0, "## [" ver "]") == 1) { capture = 1; next }
            }
            /^---/ { if (capture) exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          # Drop trailing blank lines so appending the Full Changelog link
          # below doesn't leave two blank lines before it.
          awk '{a[NR]=$0} END {n=NR; while (n>0 && a[n] ~ /^[[:space:]]*$/) n--; for (i=1;i<=n;i++) print a[i]}' release-notes.md > release-notes.md.tmp
          mv release-notes.md.tmp release-notes.md

          # Keep a Changelog nests each entry's subsections one level deeper
          # (###, ####, ...) than the version heading (##) this extraction
          # strips out. Promote every heading by one level so the release
          # body reads as a normal document instead of starting at H3.
          sed -i -E 's/^#(#{2,}) /\1 /' release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$RELEASE_VERSION]. Retitle [Unreleased] to [$RELEASE_VERSION] - YYYY-MM-DD before tagging."
            exit 1
          fi

          # Append a Full Changelog link, reusing the compare URL that
          # CHANGELOG.md's own reference-link section already records for
          # this version. The very first release's reference link points at
          # the tag itself rather than a compare view, so link the tag name
          # to its commit history instead.
          COMPARE_URL="$(awk -v ver="$RELEASE_VERSION" '
            index($0, "[" ver "]: ") == 1 {
              sub(/^\[[^]]*\]: </, "")
              sub(/>$/, "")
              print
              exit
            }
          ' CHANGELOG.md)"

          if [[ "$COMPARE_URL" == *"/compare/"* ]]; then
            printf '\n**Full Changelog**: %s\n' "$COMPARE_URL" >> release-notes.md
          elif [ -n "$COMPARE_URL" ]; then
            printf '\n**Full Changelog**: [%s](%s/%s/commits/%s)\n' \
              "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
              >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md

  # Step 4: Publish all wheels to PyPI after successful builds
  publish:
    needs: [version-check, build, create-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Download all wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Verify downloaded wheels
        run: |
          echo "Downloaded wheels:"
          ls -la dist/
          echo "Wheel count: $(ls -1 dist/*.whl | wc -l)"

      - name: Publish to PyPI
        run: uv run --only-group release --frozen twine upload dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
